'use strict';
const DATA = {"built_at":"2026-11-25T11:01:21.687Z","reviewer":"An","courses":[{"key":"dsa","name":"Data Structures and Algorithms","items":[{"kind":"question","id":"Q_T05_1_05","note":"You flagged a possible int overflow of j. The stem now limits n to 1000000, so j += i cannot overflow. Check the new stem.","record":{"question_id":"Q_T05_1_05","question_family_id":"QF_T05_1_F05","concept_id":"C05","topic_id":"T05_1","learning_objective_id":"T05_1_LO2","question_category":"tracing_application","stem":"Consider the following harmonic-step nested loop (where `1 \u003c= n \u003c= 1000000`, so `j += i` cannot overflow `int`):\n```cpp\nlong long work = 0;\nfor (int i = 1; i \u003c= n; ++i) {\n    for (int j = i; j \u003c= n; j += i) {\n        ++work;\n    }\n}\n```\nWhat is the asymptotic growth rate of `work` as a function of `n`?","options":[{"option_id":"A","text":"$\\Theta(n^2)$, because there are two nested `for` loops whose loop variables `i` and `j` both run up to the upper bound `n` on each pass."},{"option_id":"B","text":"$\\Theta(n \\log n)$ since for each `i`, the inner loop runs $\\lfloor n / i \\rfloor$ times, summing the harmonic series `n * (1 + 1/2 + ... + 1/n)`."},{"option_id":"C","text":"$\\Theta(n)$, because increasing the inner step size `j += i` on every outer pass reduces the inner loop to $O(1)$ amortized iterations."},{"option_id":"D","text":"$\\Theta(n \\cdot \\sqrt{n})$."}],"correct_option_id":"B","answer_explanation":"For a fixed `i`, `j` visits $i, 2i, 3i, \\dots, \\lfloor n/i \\rfloor\\cdot i$, which is $\\lfloor n/i \\rfloor$ iterations. Summing `n/1 + n/2 + n/3 + ... + n/n = n * H_n` where the Harmonic number $H_n = \\ln(n) + O(1)$, giving $\\Theta(n \\log n)$.","distractor_explanations":{"A":"Ignores that the inner loop increments by `j += i` rather than `++j`.","C":"The harmonic series `1 + 1/2 + ... + 1/n` diverges as $\\ln(n)$, not $O(1)$.","D":"Harmonic summation yields $n \\log n$, not $n \\sqrt{n}$."},"difficulty_estimate":"medium","misconception_tags":["harmonic_series_sieve_loop_nlogn"],"authorship_type":"AI-assisted team-authored","reference_sources":["https://en.wikipedia.org/wiki/Harmonic_number","https://opendsa-server.cs.vt.edu/OpenDSA/Books/CS3/html/AnalProgram.html#calculating-program-running-time"],"verification_method":"independent_derivation","agent_check_status":"passed","human_review_status":"approved","approved_by":"An","approved_at":"2026-11-22T09:00:00Z","reviewer_comment":"Applied on 2026-11-24 from the review note: with a large enough n, j += i could overflow int; the stem now bounds n.","version":"1.2.2"}}]},{"key":"oop","name":"Object-Oriented Programming (CSC10003)","items":[{"kind":"lesson","id":"lesson_OOP_T06_2","note":"You asked for \"read and validate each row separately\". The section \"complete\" now reads each line with std::getline and parses it on its own.","record":{"schema_version":"1.0.0","lesson_id":"lesson_OOP_T06_2","topic_id":"OOP_T06_2","concept_id":"OOP_C06","locale":"en","revision":2,"title":"Read loops and persistent records","learning_objective_ids":["OOP_T06_2_LO01","OOP_T06_2_LO02"],"estimated_core_minutes":12,"video_clip_ids":[],"source_ids":["RES_OOP_T06_2_01","RES_OOP_T06_2_02","RES_OOP_T06_2_03","RES_OOP_T06_2_04","RES_OOP_T06_2_05","RES_OOP_T06_2_06","RES_OOP_T06_2_07","RES_OOP_T06_2_08","RES_OOP_T06_2_09"],"reference_sources":["https://en.cppreference.com/cpp/io/basic_ios/operator_bool","https://en.cppreference.com/cpp/io/basic_ios/eof#Notes","https://en.cppreference.com/cpp/io/basic_istream/operator_gtgt","https://en.cppreference.com/cpp/io/basic_ostream/operator_ltlt","https://en.cppreference.com/cpp/string/basic_string/getline","https://en.cppreference.com/cpp/string/basic_string/operator_ltltgtgt","https://en.cppreference.com/cpp/filesystem/temp_directory_path","https://en.cppreference.com/cpp/filesystem/remove","https://en.cppreference.com/cpp/filesystem/path/operator_slash"],"provenance":{"human_review_status":"approved","approved_by":"An","approved_at":"2026-11-22T09:00:00Z"},"blocks":[{"id":"OOP_T06_2-intuition","type":"prose","section":"intuition","required":true,"title":"Check the attempted read","body_md":"`in >> x` attempts extraction and returns the stream. In a condition, the stream is true when it has not failed (`!fail()`). Therefore `while (in >> x) { ... }` processes x only after a successful read. `in.eof()` reports an end condition observed by a previous operation; it does not predict whether the next read will succeed."},{"id":"OOP_T06_2-records","type":"prose","section":"records","required":true,"title":"Make the text format explicit","body_md":"A persistent record is a documented sequence of fields, stored so that another read can reconstruct them. Example: decimal id, one space, decimal points, newline. Write `out \u003c\u003c row.id \u003c\u003c ' ' \u003c\u003c row.points \u003c\u003c '\\n';` and read `in >> row.id >> row.points` in that same order. A `struct Record { int id; int points; };` merely groups two public fields here; no constructor knowledge is required. A successful parse does not detect that two valid integer fields were accidentally swapped."},{"id":"OOP_T06_2-complete","type":"prose","section":"complete","required":true,"title":"Process complete records","body_md":"Use `while (in >> id >> points)` only when every record is known to be complete. The stream condition after the chain must succeed before the body processes the pair, so a missing final field leaves the last record unprocessed. A missing field in the middle of the file is worse: `>>` skips the newline, so the next row's id is read as `points`, and every later record is shifted without any error.\n\nWhen each record is one line, read and validate each row separately: read the line with `std::getline`, then parse only that line.\n\n```cpp\nstd::string line;\nwhile (std::getline(in, line)) {\n    std::istringstream row(line);\n    int id = 0, points = 0;\n    char extra = 0;\n    if (row >> id >> points && !(row >> extra)) {\n        process(id, points);      // exactly two integers on this line\n    } else {\n        report_bad_row(line);    // this row only; the next row is unaffected\n    }\n}\n```"},{"id":"OOP_T06_2-lines","type":"prose","section":"lines","required":true,"title":"Fields containing spaces","body_md":"For a full name on its own line, `std::getline(in, name)` keeps the internal spaces, consumes the newline and does not store that newline in name. Then a numeric extraction can read the score on the next line. When switching from numeric extraction back to getline in a repeated mixed-format loop, a leftover newline must be handled; the examples here avoid that separate issue by starting at the name line."},{"id":"OOP_T06_2-setup","type":"prose","section":"setup","required":true,"title":"Temporary files in the runnable examples","body_md":"The C++17 `\u003cfilesystem>` helper `temp_directory_path()` supplies a temporary directory; `directory / \"name.txt\"` forms a file path; `remove(p)` removes the test file after streams close. These helpers were introduced in the prerequisite file-basics lesson. Assume the directory exists, no other process uses the selected filename, and all shown file operations succeed except the reads that deliberately reach end of the stated data. Numeric examples use ordinary decimal values within int range."},{"id":"OOP_T06_2-code","type":"code","language":"cpp","standard":"c++17","source":"#include \u003cfilesystem>\n#include \u003cfstream>\n#include \u003ciostream>\n#include \u003cstring>\n\nint main() {\n    auto p = std::filesystem::temp_directory_path() / \"oop_b05_numbers.txt\";\n    { std::ofstream seed(p); seed \u003c\u003c \"2 4 6\\n\"; }\n    std::ifstream in(p);\n    int x = 0, count = 0, sum = 0;\n    while (in >> x) { ++count; sum += x; }\n    std::cout \u003c\u003c count \u003c\u003c \" \" \u003c\u003c sum \u003c\u003c \"\\n\";\n    in.close();\n    std::filesystem::remove(p);\n}\n","caption":"C++17 worked program. It reads 2, 4 and 6, so the output is `3 12`: three values read, sum 12. File examples use the explicit success assumptions above."},{"id":"OOP_T06_2-mistakes","type":"callout","variant":"warning","title":"Common Mistakes to Avoid","body_md":"- **Looping on `!in.eof()`:** `eof()` reports what an earlier operation saw, so `while (!in.eof()) { in >> x; process(x); }` can run `process(x)` after a failed read. Use `while (in >> x)`.\n- **Processing before testing the read:** Calling `process(x)` first, or without checking the extraction, uses a value that was never read.\n- **Using `>>` for a name with spaces:** `in >> name` stops at the first space, so `Linh Nguyen` becomes `Linh`; use `std::getline(in, name)` when the name has its own line.\n- **Swapping the field order:** Writing `quantity` then `id` but reading `id` then `quantity` parses without any error and silently puts each value in the wrong field. Keep writer and reader in the documented order."},{"id":"OOP_T06_2-checkpoint","type":"checkpoint","prompt":"Why does while (in >> id >> points) ignore a final id that has no points field?","reveal_md":"The body is entered only after the chained extraction succeeds. The missing points field makes that attempt fail, so the incomplete record is not processed. If the gap were in an earlier row, `>>` would instead read the next row's id as points; reading each line with `std::getline` and parsing it on its own prevents that.","affects_mastery":false}]}},{"kind":"resource","id":"RES_OOP_T00_2_02","note":"Automatic check on 2026-11-25: the link opens and the cited section exists on the page.","record":{"resource_id":"RES_OOP_T00_2_02","title":"Reference declaration — Lvalue references - cppreference.com","author_or_publisher":"cppreference.com","url":"https://en.cppreference.com/cpp/language/reference#Lvalue_references","concept_id":"OOP_C00","topic_ids":["OOP_T00_2"],"learning_objective_ids":["OOP_T00_2_LO01"],"relevant_section":"Lvalue references (aliasing an exis  2026-11-25: the link opens and the cited section exists on the page.","record":{"resource_id":"RES_OOP_T12_1_01","title":"C++ Core Guidelines","author_or_publisher":"C++ Core Guidelines editors","url":"https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c4-make-a-function-a-member-only-if-it-needs-direct-access-to-the-representation-of-a-class","concept_id":"OOP_C12","topic_ids":["OOP_T12_1"],"learning_objective_ids":["OOP_T12_1_LO01","OOP_T12_1_LO02"],"relevant_section":"C.4 Make a function a member only if it needs direct access","resource_type":"reference","language":"en","selection_reason":"C++ Core Guidelines C.4: supports keeping a function outside the class when it needs no representation access, the basis of the Board, Game and display responsibility split (OOP_T12_1_LO01).","license_name":"See source terms","license_url":null,"usage_mode":"link_and_metadata_only","access_requirements":"public_free","checked_at":"2026-11-17","learning_role":"core_reference","agent_check_status":"passed","human_review_status":"approved","approved_by":"An","approved_at":"2026-11-22T09:00:00Z","reviewer_comment":"","version":"1.0.0"}},{"kind":"resource","id":"RES_OOP_T12_2_03","note":"Automatic check on 2026-11-25: the link opens and the cited section exists on the page.","record":{"resource_id":"RES_OOP_T12_2_03","title":"Writing good CL descriptions | eng-practices","author_or_publisher":"Google Engineering Practices","url":"https://google.github.io/eng-practices/review/developer/cl-descriptions.html","concept_id":"OOP_C12","topic_ids":["OOP_T12_2"],"learning_objective_ids":["OOP_T12_2_LO01","OOP_T12_2_LO02"],"relevant_section":"Body is Informative; what and why of a change","resource_type":"reference","language":"en","selection_reason":"Google engineering practices, change descriptions: supports that a description gives the reasons, context and limits of a change, used by the report-excerpt and attribution items (OOP_T12_2_LO01 and LO02).","license_name":"See source terms","license_url":null,"usage_mode":"link_and_metadata_only","access_requirements":"public_free","checked_at":"2026-11-17","learning_role":"core_reference","agent_check_status":"passed","human_review_status":"approved","approved_by":"An","approved_at":"2026-11-22T09:00:00Z","reviewer_comment":"","version":"1.0.0"}}]},{"key":"cn","name":"Computer Networking (CSC10008)","items":[{"kind":"question","id":"Q_CN_T01_2_07","note":"You asked to add that an IPv4 router also decreases TTL and updates the header checksum. Option C and the explanation now say so.","record":{"question_id":"Q_CN_T01_2_07","question_family_id":"QF_CN_T01_2_F07","concept_id":"CN_C01","topic_id":"CN_T01_2","learning_objective_id":"CN_T01_2_LO02","question_category":"misconception_analysis","stem":"Looking at the encapsulation diagram `[ Link hdr | IP hdr | TCP hdr | Application Data ]`, a student makes two claims:\n1) \"The IP layer treats `TCP hdr` as a separate control channel outside the IP payload.\"\n2) \"When the packet crosses an intermediate IP router from Ethernet to Wi-Fi, the router rewrites `Application Data` to match Wi-Fi.\"\n\nWhich evaluation is accurate?","options":[{"option_id":"A","text":"Both claims are correct because IP reads the TCP header and routers translate application data for each link."},{"option_id":"B","text":"Claim (1) is correct, whereas Claim (2) is false because routers leave `Application Data` unchanged."},{"option_id":"C","text":"Both claims are false: to the IP layer, `[TCP hdr | Application Data]` together form the opaque IP payload, and an intermediate router replaces the outer Link framing and updates IPv4 header fields such as TTL, while leaving `Application Data` unchanged."},{"option_id":"D","text":"Claim (1) is false, whereas Claim (2) is correct because every Wi-Fi link requires rewriting HTTP text into radio frames."}],"correct_option_id":"C","answer_explanation":"Per Section 1.3.2 of *Systems Approach*, each lower layer treats the entire unit passed from above—both the upper-layer header (`TCP hdr`) and the user data (`Application Data`)—as an uninterpreted **body/payload**. When forwarding across different link technologies, an IP router swaps the outer Link header/trailer (`Ethernet` -> `Wi-Fi`). In the IPv4 header it decreases the TTL and recomputes the header checksum (RFC 1812, Section 5.3.1). The encapsulated Transport header and `Application Data` stay intact.","distractor_explanations":{"A":"Neither claim holds: IP encapsulates `[TCP hdr | Application Data]` as its payload, and routers do not rewrite `Application Data` for Wi-Fi.","B":"Claim (1) is also false because `TCP hdr` is inside the IP payload, not separate from it.","D":"Claim (2) is also false because Wi-Fi encapsulates the unchanged IP packet inside a Wi-Fi Link frame rather than rewriting `Application Data`."},"difficulty_estimate":"medium","misconception_tags":["upper_header_inside_lower_payload","router_rewrites_application_data","link_layer_vs_application_payload"],"authorship_type":"AI-assisted team-authored","reference_sources":["https://book.systemsapproach.org/foundation/architecture.html#encapsulation","https://book.systemsapproach.org/foundation/architecture.html#internet-architecture","https://www.rfc-editor.org/rfc/rfc1812#section-5.3.1"],"verification_method":"source_cross_check","agent_check_status":"passed","human_review_status":"approved","approved_by":"An","approved_at":"2026-11-22T09:00:00Z","reviewer_comment":"Applied on 2026-11-24 from the review note: an IPv4 router also decreases TTL and updates the header checksum; option C and the explanation now say so.","version":"1.0.1"}},{"kind":"activity","id":"ACT_CN_A23_PACKET_TRACER","note":"You left \"Packet Tracer and source checks pending\". Checked by hand on 2026-11-25: the /24 and /26 subnet math, the IOS commands and the two fault diagnoses are consistent, and the four reference links open at the cited sections. Packet Tracer itself was not run.","record":{"schema_version":"2.0.0","activity_id":"ACT_CN_A23_PACKET_TRACER","concept_id":"CN_C09","topic_ids":["CN_T09_2"],"learning_objective_ids":["CN_T09_2_LO01","CN_T09_2_LO02"],"title_en":"A23 Packet Tracer Network Design Lab: 2-LAN Router Topology, IPv4 Addressing, and Fault Checklist","title_vi":"Thực hành A23 Thiết kế mạng Packet Tracer: Mô hình Router 2 LAN, Bảng địa chỉ IPv4 và Kiểm tra lỗi","activity_type":"network_topology_design","problem_statement":"Design, configure, and troubleshoot a small 2-LAN IPv4 network in Cisco Packet Tracer:\n- **Topology**: `PC1` and `PC2` connect to Switch `S1` (LAN A); `PC3` and `Server1` connect to Switch `S2` (LAN B). Router `R1` interconnects both LANs via `GigabitEthernet0/0` (to `S1`) and `GigabitEthernet0/1` (to `S2`).\n- **Subnet Plan (ordinary IPv4 subnets; no `/31` or `/32`)**:\n  - LAN A: `192.168.10.0/24` (mask `255.255.255.0`, usable `.1`–`.254`, broadcast `.255`).\n  - LAN B: `192.168.20.0/26` (mask `255.255.255.192`, usable `.1`–`.62`, broadcast `.63`).\n**Tasks:**\n1. **IPv4 Addressing Table (`CN_T09_2_LO01`)**: Assign non-conflicting host IPs, subnet masks, and default gateways for `R1 Gi0/0`, `R1 Gi0/1`, `PC1`, `PC2`, `PC3`, and `Server1`.\n2. **Router Interface Configuration (`CN_T09_2_LO01`)**: Write Cisco IOS CLI commands to configure `R1`'s `Gi0/0` and `Gi0/1` interfaces and bring both interfaces operationally `up`.\n3. **Connectivity Criteria & Troubleshooting Checklist (`CN_T09_2_LO02`)**: State the ordered ping checks confirming intra-LAN and inter-LAN connectivity, then diagnose two faults using an ordered checklist: (Fault A) `PC1` can ping `PC2` and `192.168.10.1` but cannot ping `PC3` (`192.168.20.10`), while `PC2` CAN ping `PC3`; (Fault B) `PC3` can ping `Server1` (`192.168.20.20`) but cannot ping `192.168.20.1`, and `show ip interface brief` shows `Gi0/1` as `administratively down / down`.\nNote: Passing simulation in Packet Tracer verifies configuration consistency within the modeled topology; it does not prove production hardware behavior.","input_spec":"2-LAN single-router topology with ordinary IPv4 subnets `192.168.10.0/24` (LAN A) and `192.168.20.0/26` (LAN B) and two fault symptom descriptions.","output_spec":"Complete non-conflicting IPv4 addressing table, `R1` IOS interface commands, ordered connectivity criteria, and fault diagnoses for Fault A and Fault B.","constraints":"IPv4 only; ordinary subnets only (no `/31` or `/32`); no enterprise routing protocols needed (both LANs are directly connected to `R1`); do not claim simulation proves production behavior.","examples":[{"input":"LAN B = 192.168.20.0/26","output":"Netmask 255.255.255.192, Gateway R1 Gi0/1 = 192.168.20.1, PC3 = 192.168.20.10, Server1 = 192.168.20.20 (all within .1-.62)"}],"reference_solution":{"language":"cisco_ios_cli_and_markdown","content":"### 1. IPv4 Addressing Table\n| Device | Interface | IPv4 Address | Subnet Mask | Prefix | Default Gateway |\n|---|---|---|---|---|---|\n| R1 | GigabitEthernet0/0 | 192.168.10.1 | 255.255.255.0 | /24 | N/A (router) |\n| R1 | GigabitEthernet0/1 | 192.168.20.1 | 255.255.255.192 | /26 | N/A (router) |\n| PC1 | FastEthernet0 | 192.168.10.10 | 255.255.255.0 | /24 | 192.168.10.1 |\n| PC2 | FastEthernet0 | 192.168.10.11 | 255.255.255.0 | /24 | 192.168.10.1 |\n| PC3 | FastEthernet0 | 192.168.20.10 | 255.255.255.192 | /26 | 192.168.20.1 |\n| Server1 | FastEthernet0 | 192.168.20.20 | 255.255.255.192 | /26 | 192.168.20.1 |\n\n### 2. Router `R1` Interface Configuration (Cisco IOS CLI)\n```text\nenable\nconfigure terminal\nhostname R1\ninterface GigabitEthernet0/0\n description LAN_A_Gateway\n ip address 192.168.10.1 255.255.255.0\n no shutdown\nexit\ninterface GigabitEthernet0/1\n description LAN_B_Gateway\n ip address 192.168.20.1 255.255.255.192\n no shutdown\nexit\nend\n```\n\n### 3. Ordered Connectivity Verification Criteria\n1. Link status: `R1# show ip interface brief` shows `Gi0/0` (`192.168.10.1`) and `Gi0/1` (`192.168.20.1`) as `up / up`; `show ip route` lists both `C 192.168.10.0/24` and `C 192.168.20.0/26`.\n2. Intra-LAN checks: `PC1` pings `PC2` (`192.168.10.11`) and gateway `192.168.10.1`; `PC3` pings `Server1` (`192.168.20.20`) and gateway `192.168.20.1`.\n3. Inter-LAN checks: `PC1` pings `PC3` (`192.168.20.10`) and `Server1` (`192.168.20.20`) (first ping may drop during ARP resolution; subsequent pings succeed).\n\n### 4. Troubleshooting Checklist Diagnoses\n- **Fault A (`PC1` reaches `PC2` and `192.168.10.1`, fails `PC3`, while `PC2` reaches `PC3`)**:\n  - Step 1 (Physical/Intra-LAN): `PC1 \u003c-> PC2` and `PC1 \u003c-> 192.168.10.1` work, so `PC1`'s cable, `S1`, and `R1 Gi0/0` are healthy. `PC2 \u003c-> PC3` works, so `R1` routing and LAN B are healthy.\n  - Step 2 (Host L3 Gateway): The fault is isolated to `PC1`'s off-subnet forwarding config — `PC1` has a missing or incorrect **Default Gateway** (e.g., set to `192.168.10.254` or blank instead of `192.168.10.1`) or wrong subnet mask. Fix `PC1` default gateway to `192.168.10.1`.\n- **Fault B (`PC3` reaches `Server1`, fails `192.168.20.1`, `Gi0/1` is `administratively down / down`)**:\n  - Step 1 (`S2` intra-LAN works): `PC3 \u003c-> Server1` succeeds, so LAN B hosts and `S2` are working.\n  - Step 2 (Router interface state): `administratively down / down` means `no shutdown` was omitted on `R1 Gi0/1`. Enter `interface GigabitEthernet0/1` and run `no shutdown`."},"environment":{"tool":"Cisco Packet Tracer","tool_installed_locally":false,"target_pt_version":"Unspecified by syllabus (standard Cisco IOS 2911/1941 CLI syntax; record exact Packet Tracer version on lab PC before grading)","disclaimed_scope":"Cisco Packet Tracer is NOT installed in this environment; IPv4 subnet math was verified locally via Python ipaddress (`verify_derivations.py`), while `.pkt` simulation remains unexecuted."},"artifacts":[{"artifact_id":"A23_TOPOLOGY_AND_ADDRESS_PLAN","kind":"topology_and_addressing_plan","synthetic":true,"description":"2-LAN single-router IPv4 addressing plan (192.1 // The same checklists as review-core.js, so the export matches the review tool's decision files.
const CHECKS = {
  lesson: { source_supports: 'I opened the source and it supports this', claims_match_source: 'Each claim matches the source', code_runs: 'Code runs as written', no_copied_passages: 'No copied passages' },
  question: { source_supports: 'I opened the source and it supports this', correct_answer: 'The correct answer is correct', distractors_explained: 'Each distractor is wrong for a stated reason', facts_code_accurate: 'Facts and code are accurate' },
  resource: { source_supports: 'I opened the source and it supports this', content_accurate: 'Content is accurate and relevant', license_checked: 'I checked the license and permitted use' },
  activity: { source_supports: 'I opened the source and it supports this', facts_code_accurate: 'Facts and code are accurate', code_runs: 'Code runs as written' },
};
const STORE = 'an-followup-review-v1';
const ITEMS = DATA.courses.flatMap(c => c.items.map(it => ({ ...it, course: c.key, courseName: c.name, key: `${c.key}:${it.kind}:${it.id}` })));
let state = {};
let current = 0;

function load() {
  try { state = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch { state = {}; }
}
function save() {
  const el = document.getElementById('saved');
  try { localStorage.setItem(STORE, JSON.stringify(state)); el.textContent = 'Saved in this browser'; }
  catch { el.textContent = 'Not saved: export a backup now'; }
}
function st(it) { return state[it.key] || (state[it.key] = { checks: {}, notes: '', decision: null, decided_at: null }); }

// ---- safe rendering: DOM nodes only, never innerHTML with content ----
function el(tag, text, cls) { const n = document.createElement(tag); if (text != null) n.textContent = String(text); if (cls) n.className = cls; return n; }
function link(url) {
  let ok = false;
  try { ok = ['http:', 'https:'].includes(new URL(url).protocol); } catch { ok = false; }
  if (!ok) return el('span', url || 'missing link', 'warning');
  const a = el('a', url); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a;
}
function inline(parent, text) {
  // `code`, $math$, **bold**, *italic*
  const re = /(`[^`]+`)|(\$[^$\n]+\$)|(\*\*[^*\n]+\*\*)|(\*[^*\s][^*\n]*\*)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parent.append(document.createTextNode(text.slice(last, m.index)));
    const t = m[0];
    if (m[1]) parent.append(el('code', t.slice(1, -1)));
    else if (m[2]) {
      const span = el('span');
      try { katex.render(t.slice(1, -1), span, { throwOnError: true, output: 'html' }); }
      catch { span.textContent = t; span.className = 'katex-error'; }
      parent.append(span);
    } else if (m[3]) parent.append(el('strong', t.slice(2, -2)));
    else parent.append(el('em', t.slice(1, -1)));
    last = m.index + t.length;
  }
  if (last < text.length) parent.append(document.createTextNode(text.slice(last)));
}
function md(text) {
  const box = el('div');
  const parts = String(text || '').split(/```[a-zA-Z+]*\n?/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) { const pre = el('pre'); pre.append(el('code', part.replace(/\n$/, ''))); box.append(pre); return; }
    let list = null;
    for (const raw of part.split('\n')) {
      const line = raw.trimEnd();
      const bullet = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
      if (bullet) { if (!list) { list = el('ul'); box.append(list); } const li = el('li'); inline(li, bullet[1]); list.append(li); continue; }
      list = null;
      if (!line.trim()) continue;
      const h = line.match(/^#{1,6}\s+(.*)$/);
      const p = el(h ? 'h4' : 'p'); inline(p, h ? h[1] : line); box.append(p);
    }
  });
  return box;
}
function field(dl, label, value) {
  if (value == null || value === '') return;
  dl.append(el('dt', label));
  const dd = el('dd');
  if (value instanceof Node) dd.append(value); else inline(dd, String(value));
  dl.append(dd);
}

function renderQuestion(box, q) {
  box.append(el('h3', 'Question')); box.append(md(q.stem));
  for (const o of q.options || []) {
    const ok = o.option_id === q.correct_option_id;
    const d = el('div', null, 'option' + (ok ? ' correct' : ''));
    const head = el('div'); head.append(el('strong', `${ok ? '✓ ' : ''}${o.option_id}. `)); inline(head, o.text); d.append(head);
    const why = (q.distractor_explanations || {})[o.option_id];
    if (!ok && why) { const w = el('div', null, 'why-wrong'); inline(w, 'Why wrong: ' + why); d.append(w); }
    box.append(d);
  }
  box.append(el('h3', 'Explanation')); box.append(md(q.answer_explanation));
  if (q.reviewer_comment) { box.append(el('h3', 'What changed')); box.append(md(q.reviewer_comment)); }
}
function renderLesson(box, l) {
  for (const b of l.blocks || []) {
    const d = el('section', null, 'block');
    d.append(el('h3', `${b.title || b.section || b.type} (${b.id})`));
    if (b.body_md) d.append(md(b.body_md));
    if (b.description) d.append(md(b.description));
    if (b.source) { const pre = el('pre'); pre.append(el('code', b.source)); d.append(pre); }
    if (b.prompt) { d.append(el('p', 'Prompt:', 'help')); d.append(md(b.prompt)); }
    if (b.reveal_md) { d.append(el('p', 'Answer:', 'help')); d.append(md(b.reveal_md)); }
    box.append(d);
  }
}
function renderResource(box, r) {
  const dl = el('dl');
  field(dl, 'Link', link(r.url));
  field(dl, 'Author', r.author_or_publisher);
  field(dl, 'Cited section', r.relevant_section);
  field(dl, 'Why chosen', r.selection_reason);
  field(dl, 'Type', r.resource_type);
  field(dl, 'Role', r.learning_role);
  field(dl, 'License', r.license_name && r.license_name !== 'unknown' ? r.license_name : el('span', 'not stated: the app only links to it', 'warning'));
  field(dl, 'Use in app', r.usage_mode);
  field(dl, 'Access', r.access_requirements);
  box.append(dl);
}
function renderActivity(box, a) {
  box.append(el('h3', 'Problem')); box.append(md(a.problem_statement));
  if (a.constraints) { box.append(el('h3', 'Constraints')); box.append(md(a.constraints)); }
  if (a.reference_solution) { box.append(el('h3', 'Reference solution')); box.append(md(a.reference_solution.content)); }
  if (a.rubric) {
    box.append(el('h3', 'Rubric'));
    const ul = el('ul');
    for (const r of a.rubric) { const li = el('li'); inline(li, `${r.description} (${r.max_points} points)`); ul.append(li); }
    box.append(ul);
  }
  if (a.reference_sources) {
    box.append(el('h3', 'Sources'));
    const ul = el('ul'); for (const u of a.reference_sources) { const li = el('li'); li.append(link(u)); ul.append(li); } box.append(ul);
  }
  if (a.verification) { box.append(el('h3', 'Verification so far')); box.append(md(a.verification.actual)); }
}

function title(it) {
  const r = it.record;
  return r.title || r.title_en || (it.kind === 'question' ? it.id : it.id);
}
function renderNav() {
  const nav = document.getElementById('nav'); nav.replaceChildren();
  for (const c of DATA.courses) {
    nav.append(el('h2', `${c.name} (${c.items.length})`));
    ITEMS.forEach((it, i) => {
      if (it.course !== c.key) return;
      const b = el('button'); b.type = 'button';
      b.setAttribute('aria-current', String(i === current));
      b.append(el('span', `${it.kind}: ${it.id}`));
      const d = st(it).decision;
      b.append(el('span', d === 'approve' ? 'Approved' : d === 'revise' ? 'Needs changes' : d === 'reject' ? 'Rejected' : 'To do', 'tag ' + (d || 'todo')));
      b.addEventListener('click', () => show(i));
      nav.append(b);
    });
  }
  const done = ITEMS.filter(it => st(it).decision).length;
  document.getElementById('progress').textContent = `${done} of ${ITEMS.length} decided`;
}
function show(i) {
  current = Math.max(0, Math.min(ITEMS.length - 1, i));
  const it = ITEMS[current], box = document.getElementById('item');
  box.replaceChildren();
  box.append(el('p', `${it.courseName} · ${it.kind} · ${it.id} · item ${current + 1} of ${ITEMS.length}`, 'meta'));
  box.append(el('h2', title(it)));
  if (it.note) { const w = el('div', null, 'why'); w.append(el('b', 'Why this is here')); inline(w, it.note); box.append(w); }
  ({ question: renderQuestion, lesson: renderLesson, resource: renderResource, activity: renderActivity })[it.kind](box, it.record);

function renderPanel() {
  const it = ITEMS[current], s = st(it), box = document.getElementById('checks');

  for (const [k, label] of Object.entries(CHECKS[it.kind])) {
    const lab = el('label', null, 'check'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = s.checks[k] === true;
    cb.addEventListener('change', () => { s.checks[k] = cb.checked; save(); });
    lab.append(cb, el('span', label)); box.append(lab);
  }
  document.getElementById('notes').value = s.notes;
  const d = s.decision;
  document.getElementById('status').textContent = d ? `Decision: ${d === 'approve' ? 'Approved' : d === 'revise' ? 'Needs changes' : 'Rejected'}` : 'Not decided yet';
}
function decide(decision) {
  const it = ITEMS[current], s = st(it), status = document.getElementById('status');
  s.notes = document.getElementById('notes').value;
  if (decision === 'approve' && Object.keys(CHECKS[it.kind]).some(k => s.checks[k] !== true)) { status.textContent = 'Tick every check before approving.'; return; }
  if (decision !== 'approve' && !s.notes.trim()) { status.textContent = 'Write a note saying what to fix.'; return; }
  s.decision = decision; s.decided_at = new Date().toISOString(); save(); renderNav(); renderPanel();
  nextUnfinished();
}
function nextUnfinished() {
  for (let k = 1; k <= ITEMS.length; k++) { const i = (current + k) % ITEMS.length; if (!st(ITEMS[i]).decision) return show(i); }
  document.getElementById('status').textContent = 'All items are decided. Click Export decisions.';
}
function exportAll() {
  const now = new Date().toISOString();
  let files = 0;
  for (const c of DATA.courses) {
    const decisions = ITEMS.filter(it => it.course === c.key && st(it).decision).map(it => {
      const s = st(it);
      return { item_type: it.kind, id: it.id, decision: s.decision, comment: s.notes.trim(), checks: { ...s.checks }, decided_at: s.decided_at };
    });
    if (!decisions.length) continue;
    const blob = new Blob([JSON.stringify({ version: 1, reviewer: DATA.reviewer, exported_at: now, decisions }, null, 2) + '\n'], { type: 'application/json' });
    const a = el('a'); a.href = URL.createObjectURL(blob); a.download = `decisions-An-${c.key}-followup.json`;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    files++;
  }
  document.getElementById('status').textContent = files ? `Downloaded ${files} file(s), one per course. Send them to Cường.` : 'Nothing decided yet.';
}

load();
document.getElementById('notes').addEventListener('input', e => { st(ITEMS[current]).notes = e.target.value; save(); });
document.getElementById('approve').addEventListener('click', () => decide('approve'));
document.getElementById('revise').addEventListener('click', () => decide('revise'));
document.getElementById('reject').addEventListener('click', () => decide('reject'));
document.getElementById('clear').addEventListener('click', () => { const s = st(ITEMS[current]); s.decision = null; s.decided_at = null; save(); renderNav(); renderPanel(); });
document.getElementById('prev').addEventListener('click', () => show(current - 1));
document.getElementById('next').addEventListener('click', nextUnfinished);
document.getElementById('export').addEventListener('click', exportAll);
const first = ITEMS.findIndex(it => !st(it).decision);
show(first < 0 ? 0 : first);
</script>
